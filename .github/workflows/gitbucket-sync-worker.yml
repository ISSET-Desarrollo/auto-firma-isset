name: Copiar ramas y etiquetas a GitBucket

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gitbucket-sync-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository_owner == 'ISSET-Desarrollo'
    runs-on: [self-hosted, linux, x64, gitbucket-sync]
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITBUCKET_BASE_URL: http://127.0.0.1:8080
      GITBUCKET_OWNER: GITHUB_SYNC
    steps:
      - name: Reflejar todos los cambios de ramas y etiquetas
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          set -a
          source /etc/github-sync-runner/gitbucket.env
          set +a
          : "${GITHUB_TOKEN:?Falta el token de GitHub}"
          : "${GITBUCKET_USER:?Falta el usuario de GitBucket}"
          : "${GITBUCKET_TOKEN:?Falta la credencial de GitBucket}"
          export GIT_TERMINAL_PROMPT=0
          work="$(mktemp -d "${RUNNER_TEMP}/gitbucket-sync.XXXXXX")"
          export GIT_ASKPASS="$work/askpass"
          cat > "$GIT_ASKPASS" <<'ASKPASS'
          #!/usr/bin/env bash
          set -eu
          case "$1" in
            *github.com*)
              case "$1" in
                *Username*) printf '%s\n' 'x-access-token' ;;
                *Password*) printf '%s\n' "$GITHUB_TOKEN" ;;
                *) exit 1 ;;
              esac ;;
            *127.0.0.1:8080*)
              case "$1" in
                *Username*) printf '%s\n' "$GITBUCKET_USER" ;;
                *Password*) printf '%s\n' "$GITBUCKET_TOKEN" ;;
                *) exit 1 ;;
              esac ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$GIT_ASKPASS"
          export LC_ALL=C
          cache="/opt/github-sync-runner/cache/${GITHUB_REPOSITORY}"
          mkdir -p "$cache"
          exec 9>"$cache/sync.lock"
          flock -w 120 9
          if [[ ! -d "$cache/repo.git" ]]; then
            git -c credential.helper= init --bare "$cache/repo.git"
          fi
          cd "$cache/repo.git"
          if git remote get-url source >/dev/null 2>&1; then
            git remote set-url source "https://github.com/${GITHUB_REPOSITORY}.git"
            git remote set-url target "${GITBUCKET_BASE_URL}/git/${GITBUCKET_OWNER}/${GITHUB_REPOSITORY#*/}.git"
          else
            git remote add source "https://github.com/${GITHUB_REPOSITORY}.git"
            git remote add target "${GITBUCKET_BASE_URL}/git/${GITBUCKET_OWNER}/${GITHUB_REPOSITORY#*/}.git"
          fi
          for attempt in 1 2 3; do
            if git -c credential.helper= -c http.version=HTTP/1.1 \
              -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=120 \
              fetch --progress --prune --no-tags source \
              '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo 'La descarga no terminó después de tres intentos.' >&2
              exit 1
            fi
            echo 'Reintentando la descarga después de una conexión interrumpida.'
            sleep 15
          done
          while IFS= read -r ref; do
            if git grep -I -l 'filter=lfs' "$ref" -- '.gitattributes' '**/.gitattributes' >/dev/null; then
              echo "El repositorio utiliza Git LFS. Debe configurarse la copia de objetos LFS antes de continuar." >&2
              exit 1
            fi
          done < <(git for-each-ref --format='%(refname)' refs/heads refs/tags)
          # Solo se actualizan ramas y etiquetas del destino GITHUB_SYNC.
          git for-each-ref --format='%(refname)' refs/heads refs/tags | sort > "$work/source-names"
          git -c credential.helper= ls-remote --refs target 'refs/heads/*' 'refs/tags/*' \
            | awk '{print $2}' | sort > "$work/target-names"
          refspecs=()
          while IFS= read -r ref; do
            refspecs+=("+$ref:$ref")
          done < "$work/source-names"
          while IFS= read -r ref; do
            refspecs+=(":$ref")
          done < <(comm -13 "$work/source-names" "$work/target-names")
          if (( ${#refspecs[@]} )); then
            git -c credential.helper= push --atomic target "${refspecs[@]}"
          fi
          git for-each-ref --format='%(objectname) %(refname)' refs/heads refs/tags | sort > "$work/source-refs"
          git -c credential.helper= ls-remote --refs target 'refs/heads/*' 'refs/tags/*' \
            | awk '{print $1 " " $2}' | sort > "$work/target-refs"
          missing="$(comm -3 "$work/source-refs" "$work/target-refs")"
          if [[ -n "$missing" ]]; then
            echo 'La verificación detectó referencias que no coinciden.' >&2
            exit 1
          fi
          echo 'Ramas y etiquetas idénticas al origen, incluidas reescrituras y eliminaciones.'
